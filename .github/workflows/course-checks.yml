name: Course checks
on:
  push:
  pull_request:
jobs:
  laboratory-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Labs/requirements.txt
      - run: python -m pip install -r Labs/requirements.txt
      - run: python tools/validate_course.py
      - run: python -m unittest discover -s Labs -p test_labs.py -v
  m01-research-evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.8
      - run: uv sync --project course_source/modules/M01 --frozen --python 3.12
      - run: uv run --project course_source/modules/M01 --frozen python course_source/modules/M01/fetch_data.py --from-file Labs/datasets/esol.csv
      - run: uv run --project course_source/modules/M01 --frozen python course_source/modules/M01/register_kernel.py
      - run: uv run --project course_source/modules/M01 --frozen python course_source/modules/M01/run_checks.py --output tmp/m01-ci-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m01-evidence-${{ matrix.os }}
          path: tmp/m01-ci-evidence/
