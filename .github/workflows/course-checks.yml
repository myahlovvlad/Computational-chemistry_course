name: Course structure and pilot checks
on:
  push:
  pull_request:
jobs:
  pilot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/scripts/environment/.venv-chem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.8
      - run: python scripts/setup_environment.py --profile base --uv uv
      - run: python scripts/setup_environment.py --profile chem --uv uv
      - run: uv run --project scripts/environment --frozen --group chem python scripts/check_sources.py
      - run: uv run --project scripts/environment --frozen --group chem python scripts/build_notebooks.py --only M01-L01 M03-L01 M03-L02
      - run: uv run --project scripts/environment --frozen --group chem python scripts/validate_course.py --out tmp/ci-structure.json
      - run: uv run --project scripts/environment --frozen --group chem python -m unittest discover -s practicuum/shared/tests -p test_*.py -v
      - run: uv run --project scripts/environment --frozen --group chem python scripts/run_course.py --only M01-L01 M03-L01 M03-L02 --out tmp/ci-pilot
      - run: uv run --project scripts/environment --frozen --group chem python archive/legacy-20261118/course_source/modules/M01/verify_evidence.py
      - run: uv run --project scripts/environment --frozen --group chem python parser/build.py --allow-partial --out parser/dist/ci
      - run: uv run --project scripts/environment --frozen --group chem python parser/validate_package.py parser/dist/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-evidence-${{ matrix.os }}
          path: |
            tmp/ci-pilot/
            tmp/ci-structure.json
            parser/dist/ci/package.json
