[project]
name = "computational-chemistry-course"
version = "2.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "matplotlib==3.11.2", "nbformat==5.11.1", "nbclient==0.11.0",
  "ipykernel==7.4.0", "jupyterlab==4.6.6", "nbconvert==7.17.2"
]

[dependency-groups]
chem = [
  "rdkit==2026.9.1", "numpy==2.5.4", "pandas==3.1.1",
  "scipy==1.18.1", "scikit-learn==1.9.1", "networkx==3.7",
  "requests==2.34.2", "streamlit==1.67.0"
]
docking = [
    {include-group = "chem"},
    "gemmi==0.7.5 ; sys_platform == 'linux'",
    "meeko==0.8.0 ; sys_platform == 'linux'",
    "pdb2pqr==3.8.0 ; sys_platform == 'linux'",
    "vina==1.2.7 ; sys_platform == 'linux'",
]
quantum-core = [
    {include-group = "chem"},
    "pyscf==2.15.1",
]
quantum = [
    {include-group = "quantum-core"},
    "geometric==1.1.1 ; sys_platform == 'linux'",
    "pyscf-dispersion==1.7.0 ; sys_platform == 'linux'",
]

[tool.uv]
package = false
